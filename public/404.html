<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | CargoTracker</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #FAFAFA;
            color: #0F172A;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            max-width: 460px;
            text-align: center;
            background: #fff;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            padding: 48px 36px;
            box-shadow: 0 18px 40px -24px rgba(15, 23, 42, .35);
        }
        .code {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -2px;
            color: #FF3E41;
            line-height: 1;
        }
        h1 { font-size: 20px; margin: 18px 0 8px; }
        p { color: #64748B; font-size: 14px; line-height: 1.65; margin: 0 0 26px; }
        a {
            display: inline-block;
            background: #FF3E41;
            color: #fff;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            padding: 13px 26px;
            border-radius: 10px;
            transition: background .15s ease;
        }
        a:hover { background: #E03438; }
    </style>
</head>

<body>
    <main class="card">
        <div class="code">404</div>
        <h1>This route is not in the manifest</h1>
        <p>The page you asked for does not exist. Head back to the tracking terminal to look up a waybill.</p>
        <a href="/index.htmltracking</a>
    </main>
</body>

</html>
