<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Cargo Image">
  <defs>
    <linearGradient id="g-generic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="p-generic" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#06B6D4" stroke-opacity="0.10" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#g-generic)"/>
  <rect width="800" height="600" fill="url(#p-generic)"/>
  <rect x="0" y="0" width="800" height="4" fill="#FF3E41"/>
  <g font-family="Inter, Poppins, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="400" y="304.4" font-size="44" font-weight="700" letter-spacing="0.5">Cargo Image</text>
    
    <text x="400" y="546" font-size="23" font-weight="600" fill="#06B6D4" letter-spacing="4.14">CARGOTRACKER</text>
  </g>
